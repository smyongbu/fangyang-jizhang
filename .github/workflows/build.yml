name: Build APK

# 每次 push、PR，或手动点击都会触发云端编译
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 给 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk fangyang-jizhang.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: fangyang-jizhang.apk
          if-no-files-found: error

      # 只有 push 到 main 时才发布到 Releases
      - name: 发布到 Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版 APK
          body: |
            方羊记账 最新自动编译安装包。
            每次 push 到 main 会自动更新这里的 APK。
            提交：${{ github.sha }}
          files: fangyang-jizhang.apk
